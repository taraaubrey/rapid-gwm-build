vars:
  ws: C:/Users/tfo46/e_Python/a_rbm/rapid-gwm-build/examples/pakipaki # path to the data files
  mf6_exe: C:/Users/tfo46/e_Python/a_rbm/rapid-gwm-build/examples/bin/mf6.exe # path to the mf6 executable
  data_dir: C:\Users\tfo46\OneDrive - University of Canterbury\Tara_PhD\c_PhD\c_Data
  scripts: C:\Users\tfo46\e_Python\a_rbm\rapid-gwm-build\examples\pakipaki\scripts
  top: ${vars.data_dir}/b_derived/dem_elevation_derivatives/dem_clipped.tif
  res_src: ${vars.data_dir}/a_source\skytem_skytem\Heretaunga_skytem_3Dmodels\Heretaunga_SkyTEM_3Dmodels_V1_2023.csv

simulation:
  setup:
    sim_type: mf6 # required
    ws: ${vars.ws}/models/pakipaki-v01 # these get created
    sim_name: pakipaki # required
  
  mesh:
    crs: 2193
    nlay: 6
    resolution: 25
    domain: examples\manual_builds\data\model2_domain.shp
    active_domain:
      input: examples\manual_builds\data\model2_domain.shp
      pipeline:
        - processor: ${vars.scripts}/pkpk_functions.make_bottom_inactive
          bottoms: '@mesh.bottoms'
          inactive_dims: [-2, -1]
    top: ${vars.top}
    bottoms:
      input: examples\pakipaki01\models\derived_data\basement_z.tif
      pipeline:
        - processor: ${vars.scripts}/utils.make_layers
          confined_elev: -10
          gravel_elev: -20
          min_thickness: 1
          top: '@mesh.top'
        - processor: top_only
          top_only: True
  
  modules:
    # default_build:
    #   - sim
    #   - gwf
    #   - dis
    sim:
      cmd:
        sim_name: \pakipaki
        version: 'mf6'
        exe_name: ${vars.mf6_exe}
        sim_ws: ${vars.ws}/models/pakipaki-v01
    
    tdis:
      cmd:
        time_units: DAYS
        nper: 1
        perioddata:
          - [1., 1, 1.] # perlen, nstp, tsmult
    
    ims:
      cmd:
        complexity: COMPLEX
        print_option: ALL
    
    gwf:
      cmd:
        modelname: pakipaki
        model_nam_file: pakipaki.nam
        save_flows: True

    dis:
      cmd:
        length_units: METERS
    
    npf:
      cmd:
        save_specific_discharge: True
        icelltype: 0
    
    ic:
      cmd:
        strt: '@mesh.top'
    
    drn-riv:
      data:
        mask: ${vars.data_dir}\b_derived\mod_model_files\pakipaki\shp\model2_drains.shp
        elev:
          input:
            src: ${vars.top}
            resampling: min
          metadata:
            lb: 0.01
            ub: 100
          levels:
            input:
              - regional_dem.tif
              - national_dem.tif
            pipeline:
              - processor: scikit.learn.smooth
        cond:
          input: 1
          metadata:
            lb: 0.01
            ub: 100
          pipeline:
            - processor: calc_from_res
              delr: '@modules.dis.delr'
              delc: '@modules.dis.delc'
      cmd:
        pname: drn-riv
    
    rcha:
      data:
        recharge:
          input: 0.00025
          builtin:
            top_only: True
        mask: '@mesh.'
    
    wel-mbr:
      data:
        mask:
          input: ${vars.data_dir}\b_derived\mod_model_files\pakipaki\shp\model2_mbr.shp
          pipeline:
            - processor: get_interior_boundary
              active_domain: '@mesh.active_domain'
            - processor: np.logical_and
              x2: '@modules.wel-mbr.data.mask.input'
            # - processor: exclude
            #   zones:
            #     - '@module.chd.data.mask'
        flux: 2

