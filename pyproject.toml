[project]
name = "rapid-gwm-build"
version = "0.1.0"
description = "A Python package for building numerical groundwater models."
readme = "README.md"
authors = [
    { name = "taraaubrey", email = "tara.a.forstner@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "affine>=2.4.0",
    "fiona>=1.10.1",
    "flopy>=3.9.2",
    "gridit>=0.7",
    "joblib>=1.5.1",
    "matplotlib>=3.10.1",
    "networkx>=3.4.2",
    "pyyaml>=6.0.2",
    "rasterio>=1.5.0",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
]

[project.scripts]
rmb = "rapid_gwm_build.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "debugpy>=1.8.14",
    "ruff>=0.11.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "mesh: Mesh parsing tests",
    "slow: Slow-running tests",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
]
debug = [
    "debugpy>=1.8.14",
]
data = [
    "dvc>=3.59.2",
]
notebook = [
    "ipykernel>=6.29.5",
]

[tool.ruff]
exclude = ["notebooks", "refs"]
