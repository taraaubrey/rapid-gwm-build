[project]
name = "rapid-gwm-build"
version = "0.1.0"
description = "A Python package for building numerical groundwater models."
readme = "README.md"
authors = [
    { name = "taraaubrey", email = "tara.a.forstner@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cerberus>=1.3.7",
    "debugpy>=1.8.14",
    "dvc>=3.59.2",
    "flopy==3.9.2", #TODO: remove hardcoded version (user only needs if using flopy)
    "gridit>=0.7",
    "ipykernel>=6.29.5",
    "joblib>=1.5.1",
    "matplotlib>=3.10.1",
    "modflow-setup>=0.6.1", #HACK: hardcoded for now (eventually will remove)
    "netcdf4>=1.7.2", #HACK: hardcoded for now (remove)
    "networkx>=3.4.2",
    "pyemu>=1.3.8",
    "pyshp>=2.3.1",
    "pyyaml>=6.0.2",
    "setuptools>=78.1.0", #HACK remove when remove modflow-setup
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.11.6",
]

# Add to your existing pyproject.toml or create it

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "mesh: Mesh parsing tests",
]

# Add test dependencies
[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
]
