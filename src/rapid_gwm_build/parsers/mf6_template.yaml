# TODO
# - how does Simulation know that it needs a discretization module?
# - how does Simulation know what a tdis module is?
write:
    # 0: {func: ['@modules.sim', 'set_all_data_external']}
    0: {func: ['@modules.sim', 'write_simulation']}

modules:
    obs:
        func: 'flopy.mf6.modflow.mfutlobs'
        duplicates_allowed: True
        build_dependencies: 
            model: '@modules.gwf' # referencing {modules.gwf..output}
    
    sim:
        func: 'flopy.mf6.MFSimulation'
        duplicates_allowed: False
        default_build:
            allowed: True

    tdis:
        build_dependencies: 
            simulation: '@modules.sim'
        func: 'flopy.mf6.ModflowTdis'
        duplicates_allowed: False
        default_build:
            allowed: True
            parameters:
                time_units: 'days'
                start_date_time: '2020-01-01'
                nper: 1
                perioddata:
                    - [1., 1, 1.] # perlen, nstp, tsmult

    ims:
        build_dependencies: 
            simulation: '@modules.sim'
        func: 'flopy.mf6.ModflowIms'
        duplicates_allowed: False
        default_build:
            allowed: True


    ## GWF packages ----------------------
    gwf:
        build_dependencies: 
            simulation: '@modules.sim'
        func: 'flopy.mf6.ModflowGwf'
        duplicates_allowed: True
        default_build:
            allowed: True

    npf: 
        build_dependencies: 
            model: '@modules.gwf' # referencing {modules.gwf..output}
        func: 'flopy.mf6.ModflowGwfnpf'
        duplicates_allowed: True
        default_build:
            allowed: True

    dis:
        build_dependencies: 
            model: '@modules.gwf'
            nlay: '@mesh.nlay'
            nrow: '@mesh.nrow'
            ncol: '@mesh.ncol'
            delr: 
                input: '@mesh.delr'
                builtin:
                    - array_to_file
            delc:
                input: '@mesh.delc'
                builtin:
                    - array_to_file
            top:                     
                input: '@mesh.top'
                builtin:
                    - array_to_file
            botm:
                input: '@mesh.bottoms'
                builtin:
                    - array_to_file:
                        by_layer: True
            idomain:
                input: '@mesh.active_domain'
                builtin:
                    - array_to_file:
                        by_layer: True
            xorigin: '@mesh.xorigin'
            yorigin: '@mesh.yorigin'
        func: 'flopy.mf6.ModflowGwfdis'
        duplicates_allowed: False
        default_build: True

    ic: 
        build_dependencies: 
            model: '@modules.gwf'
            strt: '@mesh.top'
        func: 'flopy.mf6.ModflowGwfic'
        duplicates_allowed: False

    sto: 
        build_dependencies: 
            model: '@modules.gwf'
        func: 'flopy.mf6.ModflowGwfsto'
        duplicates_allowed: False
    
## Simple stress packages ----------------------

    wel:
        build_dependencies: 
            model: '@modules.gwf'
        func: 'flopy.mf6.ModflowGwfwel'
        duplicates_allowed: True

    
    drn:
        build_dependencies: 
            model: '@modules.gwf'
            stress_period_data:
                input:
                    src:
                        cond: '@modules.drn.data.cond'
                        elev: '@modules.drn.data.elev'
                pipeline:
                    - processor: check_dims_andor_add_tdis
                      tdis: '@modules.tdis.nper'
                    - processor: array_to_table
                      by_stress_period: True
                      mask: '@modules.drn.data.mask'
                      col_names: ['k', 'i', 'j', 'elev', 'cond']
        data:
            - mask
            - cond
            - elev
        func: flopy.mf6.ModflowGwfdrn
        parameterization:
            index_cols: [0,1,2]
            param:
                elev:
                    use_cols: [3]
                    par_style: 'a' # addative
                    lb: -2
                    ub: 2
                cond:
                    use_cols: [4]
                    lb: 0.01
                    ub: 100


    ghb:
        build_dependencies: 
            model: '@modules.gwf'          
        func: 'flopy.mf6.ModflowGwfghb'
        duplicates_allowed: True

    rcha:
        build_dependencies: 
            model: '@modules.gwf'
            recharge:
                input: '@modules.rcha.data.recharge'
                pipeline:
                    - processor: check_dims_add_tdis
                      tdis: '@modules.tdis.nper'
                    - processor: array_to_file
                      by_stress_period: True
                      mask: '@cmd.dis.top'
        data:
            - recharge
            - mask
        func: 'flopy.mf6.ModflowGwfrcha'

    
    rch:
        build_dependencies: 
            model: '@modules.gwf'
        func: 'flopy.mf6.ModflowGwfrch'
        duplicates_allowed: True


    # ??
    sfr:
        build_dependencies: 
            model: '@modules.gwf'
        func: 'flopy.mf6.ModflowGwfsfr'
        duplicates_allowed: True

    oc:
        build_dependencies: 
            model: '@modules.gwf'
        func: 'flopy.mf6.ModflowGwfoc'
        duplicates_allowed: True