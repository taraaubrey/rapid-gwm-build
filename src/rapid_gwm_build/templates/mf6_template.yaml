# TODO
# - how does Simulation know that it needs a discretization module?
# - how does Simulation know what a tdis module is?
write:
    # 0: {func: ['@modules.sim', 'set_all_data_external']}
    0: {func: ['@modules.sim', 'write_simulation']}

modules:
    obs:
        func: 'flopy.mf6.modflow.mfutlobs'
        duplicates_allowed: True
        build_dependencies: 
            model: '@modules.gwf' # referencing {modules.gwf..output}
    
    sim:
        func: 'flopy.mf6.MFSimulation'
        duplicates_allowed: False
        default_build:
            allowed: True

    tdis:
        build_dependencies: 
            simulation: '@modules.sim'
        func: 'flopy.mf6.ModflowTdis'
        duplicates_allowed: False
        default_build:
            allowed: True
            parameters:
                time_units: 'days'
                start_date_time: '2020-01-01'
                nper: 1
                perioddata:
                    - [1., 1, 1.] # perlen, nstp, tsmult

    ims:
        build_dependencies: 
            simulation: '@modules.sim'
        func: 'flopy.mf6.ModflowIms'
        duplicates_allowed: False
        default_build:
            allowed: True


    ## GWF packages ----------------------
    gwf:
        build_dependencies: 
            simulation: '@modules.sim'
        func: 'flopy.mf6.ModflowGwf'
        duplicates_allowed: True
        default_build:
            allowed: True

    npf: 
        build_dependencies: 
            model: '@modules.gwf'
            k:
                input: '@modules.npf.data.k'
                builtin:
                    - check_data_dims_tdis:
                        expected_dims: 3
                    - array_to_file:
                        output_type: 'array'
                        by_layer: True
                        by_stress_period: False
                        filename_format:
                            src: '{modelname}.{pkg_type_name}_{paramname}_layer{ilay}.txt'
                            resolution_mode: 'literal'
                        return_arg:
                            filename: '{filename}'
        func: 'flopy.mf6.ModflowGwfnpf'
        duplicates_allowed: True
        default_build:
            allowed: True

    dis:
        build_dependencies: 
            model: '@modules.gwf'
            nlay: '@mesh.nlay'
            nrow:
                input: 'nrow'
                builtin:
                    - from_structured_mesh
            ncol:
                input: 'ncol'
                builtin:
                    - from_structured_mesh
            delr: 
                input: 'delr'
                builtin:
                    - from_structured_mesh
                    - array_to_file:
                        output_type: 'array'
                        by_layer: False
                        by_stress_period: False
                        filename_format:
                            src: '{modelname}.{pkg_type_name}_{paramname}.txt'
                            resolution_mode: 'literal'
                        return_arg:
                            filename: '{filename}'
            delc:
                input: 'delc'
                builtin:
                    - from_structured_mesh
                    - array_to_file:
                        output_type: 'array'
                        by_layer: False
                        by_stress_period: False
                        filename_format:
                            src: '{modelname}.{pkg_type_name}_{paramname}.txt'
                            resolution_mode: 'literal'
                        return_arg:
                            filename: '{filename}'
            top:                     
                input: '@mesh.top'
                builtin:
                    - check_data_dims_tdis:
                        expected_dims: 2
                    - array_to_file:
                        output_type: 'array'
                        by_layer: False
                        by_stress_period: False
                        filename_format:
                            src: '{modelname}.{pkg_type_name}_{paramname}.txt'
                            resolution_mode: 'literal'
                        return_arg:
                            filename: '{filename}'
            botm:
                input: '@mesh.bottoms'
                builtin:
                    - check_data_dims_tdis:
                        expected_dims: 3
                    - array_to_file:
                        output_type: 'array'
                        by_layer: True
                        by_stress_period: False
                        filename_format:
                            src: '{modelname}.{pkg_type_name}_{paramname}_layer{ilay}.txt'
                            resolution_mode: 'literal'
                        return_arg:
                            filename: '{filename}'
            idomain:
                input: '@mesh.active_domain'
                builtin:
                    - check_data_dims_tdis:
                        expected_dims: 3
                    - array_to_file:
                        output_type: 'array'
                        by_layer: True
                        by_stress_period: False
                        filename_format:
                            src: '{modelname}.{pkg_type_name}_{paramname}_layer{ilay}.txt'
                            resolution_mode: 'literal'
            xorigin:
                input: 'xorigin'
                builtin:
                    - from_structured_mesh
            yorigin: 
                input: 'xorigin'
                builtin:
                    - from_structured_mesh
        func: 'flopy.mf6.ModflowGwfdis'
        duplicates_allowed: False
        default_build: True

    ic: 
        build_dependencies: 
            model: '@modules.gwf'
            strt:
                input: '@mesh.top'
                builtin:
                    - check_data_dims_tdis:
                        expected_dims: 3
                    - array_to_file:
                        output_type: 'array'
                        by_layer: True
                        by_stress_period: False
                        filename_format:
                            src: '{modelname}.{pkg_type_name}_{paramname}_layer{ilay}.txt'
                            resolution_mode: 'literal'
        func: 'flopy.mf6.ModflowGwfic'
        duplicates_allowed: False

    # sto: 
    #     build_dependencies: 
    #         model: '@modules.gwf'
    #     func: 'flopy.mf6.ModflowGwfsto'
    #     duplicates_allowed: False
    
## Simple stress packages ----------------------

    wel:
        build_dependencies: 
            model: '@modules.gwf'
            stress_period_data:
                input:
                    flux: '@modules.wel.data.flux'
                    mask: '@modules.wel.data.mask'
                builtin:
                    - check_data_dims_tdis:
                        expected_dims: 4
                    - array_to_file:
                        output_type: 'table'
                        by_stress_period: True
                        col_names: ['k', 'i', 'j', 'flux']
                        filename_format: 
                            src: '{modelname}.{pkg_type_name}_{paramname}_{kper}.txt'
                            resolution_mode: 'literal'
        func: 'flopy.mf6.ModflowGwfwel'
        data:
            - mask
            - flux
        duplicates_allowed: True

    
    drn:
        build_dependencies: 
            model: '@modules.gwf'
            stress_period_data:
                input:
                    cond: '@modules.drn.data.cond'
                    elev: '@modules.drn.data.elev'
                    mask: '@modules.drn.data.mask'
                builtin:
                    - check_data_dims_tdis:
                        expected_dims: 4 
                    - array_to_file:
                        output_type: 'table'
                        by_stress_period: True
                        col_names: ['k', 'i', 'j', 'elev', 'cond']
                        filename_format:
                            src: '{modelname}.{pkg_type_name}_{paramname}_{kper}.txt'
                            resolution_mode: 'literal'
        data:
            - mask
            - cond
            - elev
        func: flopy.mf6.ModflowGwfdrn
        parameterization:
            index_cols: [0,1,2]
            param:
                elev:
                    use_cols: [3]
                    par_style: 'a' # addative
                    lb: -2
                    ub: 2
                cond:
                    use_cols: [4]
                    lb: 0.01
                    ub: 100


    ghb:
        build_dependencies: 
            model: '@modules.gwf'
            stress_period_data:
                input:
                    head: '@modules.ghb.data.head'
                    cond: '@modules.ghb.data.cond'
                    mask: '@modules.ghb.data.mask'
                builtin:
                    - check_data_dims_tdis:
                        expected_dims: 4 # kper, k, i, j
                    - array_to_file:
                        output_type: 'table'
                        by_stress_period: True
                        col_names: ['k', 'i', 'j', 'head', 'cond']
                        filename_format: 
                            src: '{modelname}.{pkg_type_name}_{paramname}_{kper}.txt'
                            resolution_mode: 'literal'
                        return_arg:
                            '{kper}':
                                filename: '{filename}'
        data:
            - mask
            - cond
            - head
        func: 'flopy.mf6.ModflowGwfghb'
        duplicates_allowed: True

    rcha:
        build_dependencies: 
            model: '@modules.gwf'
            recharge:
                input: '@modules.rcha.data.recharge'
                builtin:
                    - check_data_dims_tdis:
                        expected_dims: 3 # kper, i, j
                    - array_to_file:
                        output_type: 'array'
                        by_stress_period: True
                        filename_format: 
                            src: '{modelname}.{pkg_type_name}_{paramname}_{kper}.txt'
                            resolution_mode: 'literal'
                        # return_arg:
                        #     '{kper}':
                        #         filename: '{filename}'
        data:
            - recharge
            - mask
        func: 'flopy.mf6.ModflowGwfrcha'


    chd:
        build_dependencies: 
            model: '@modules.gwf'
            stress_period_data:
                input:
                    head: '@modules.chd.data.head'
                    mask: '@modules.chd.data.mask'
                builtin:
                    - check_data_dims_tdis:
                        expected_dims: 4
                    - array_to_file:
                        output_type: 'table'
                        by_stress_period: True
                        col_names: ['k', 'i', 'j', 'head']
                        filename_format: 
                            src: '{modelname}.{pkg_type_name}_{paramname}_{kper}.txt'
                            resolution_mode: 'literal'
                        # return_arg:
                        #     '{kper}':
                        #         filename: '{filename}'
        data:
            - mask
            - head
        func: 'flopy.mf6.ModflowGwfchd'
        parameterization:
            index_cols: [0,1,2]
            param:
                head:
                    use_cols: [3]
                    lb: 0.01
                    ub: 100
    
    # rch:
    #     build_dependencies: 
    #         model: '@modules.gwf'
    #     func: 'flopy.mf6.ModflowGwfrch'
    #     duplicates_allowed: True


    # # ??
    # sfr:
    #     build_dependencies: 
    #         model: '@modules.gwf'
    #     func: 'flopy.mf6.ModflowGwfsfr'
    #     duplicates_allowed: True

    oc:
        build_dependencies: 
            model: '@modules.gwf'
        func: 'flopy.mf6.ModflowGwfoc'
        duplicates_allowed: True