# TODO
# - how does Simulation know that it needs a discretization module?
# - how does Simulation know what a tdis module is?
write:
    # 0: {func: ['@module.sim', 'set_all_data_external']}
    0: {func: ['@module.sim', 'write_simulation']}

module_templates:
    obs:
        func: 'flopy.mf6.modflow.mfutlobs'
        duplicates_allowed: True
        build_dependencies: 
            model: '@module.gwf' # referencing {modules.gwf..output}
    
    sim:
        func: 'flopy.mf6.MFSimulation'
        duplicates_allowed: False
        default_build:
            allowed: True

    tdis:
        build_dependencies: 
            simulation: '@module.sim'
        # parameters:
        #     period_data: ['nper', 'perlen', 'nstp', 'steady'] #TODO: this is a special list of adjustable parameters which are not explicitly called
        func: 'flopy.mf6.ModflowTdis'
        duplicates_allowed: False
        default_build:
            allowed: True
            parameters:
                time_units: 'days'
                start_date_time: '2020-01-01'
                nper: 1
                perioddata:
                    - [1., 1, 1.] # perlen, nstp, tsmult

    ims:
        build_dependencies: 
            simulation: '@module.sim'
        func: 'flopy.mf6.ModflowIms'
        duplicates_allowed: False
        default_build:
            allowed: True


    ## GWF packages ----------------------
    gwf:
        build_dependencies: 
            simulation: '@module.sim'
        func: 'flopy.mf6.ModflowGwf'
        duplicates_allowed: True
        default_build:
            allowed: True

    npf: 
        build_dependencies: 
            model: '@module.gwf' # referencing {modules.gwf..output}
        func: 'flopy.mf6.ModflowGwfnpf'
        duplicates_allowed: True
        default_build:
            allowed: True

    dis:
        build_dependencies: 
            model: '@module.gwf'
            nlay: '@mesh.nlay'
            nrow: '@mesh.nrow'
            ncol: '@mesh.ncol'
            delr: 
                pipeline:
                    - processor: to_mf6_txt
                      data: '@mesh.delr'
                      type: array
                      output_format: '{filename}'
                    # output: (input.dis.nlay).data'@mesh.delr'
            delc:
                pipeline:
                    - processor: to_mf6_txt
                      data: '@mesh.delr'
                      type: array
                      output_format: '{filename}'
                    # output: (input.dis.nlay).data'@mesh.delr'
            top:                     
                pipeline:
                    - processor: to_mf6_txt
                      data: '@mesh.top'
                      type: array
                      output_format: '{filename}'
                    # output: (input.dis.nlay).data'@mesh.delr'
            botm:
                pipeline:
                    - processor: to_mf6_txt
                      data: '@mesh.bottoms'
                      type: array
                      output_format: '{filename}'
                    # output: (input.dis.nlay).data'@mesh.delr'
            idomain:
                pipeline:
                    - processor: to_mf6_txt
                      data: '@mesh.idomain'
                      type: array
                      output_format: '{filename}'
                    # output: (input.dis.nlay).data'@mesh.delr'
        func: 'flopy.mf6.ModflowGwfdis'
        duplicates_allowed: False
        default_build:
            allowed: True

    ic: 
        build_dependencies: 
            model: '@module.gwf'
        func: 'flopy.mf6.ModflowGwfic'
        duplicates_allowed: False

    sto: 
        build_dependencies: 
            model: '@module.gwf'
        func: 'flopy.mf6.ModflowGwfsto'
        duplicates_allowed: False
    
## Simple stress packages ----------------------

    wel:
        build_dependencies: 
            model: '@module.gwf'
        func: 'flopy.mf6.ModflowGwfwel'
        duplicates_allowed: True


    drn: 
        build_dependencies: 
            model: '@module.gwf'
            stressperioddata: '@self.output'
        func: flopy.mf6.ModflowGwfdrn
        duplicates_allowed: True
        output:
            func: 'data2table'
            kwargs:
                type: table
                col_names: ['k', 'i', 'j', 'cond', 'elev']
        parameterization:
            index_cols: [0,1,2]
            param:
                elev:
                    use_cols: [3]
                    par_style: 'a' # addative
                    lb: -2
                    ub: 2
                cond:
                    use_cols: [4]
                    lb: 0.01
                    ub: 100


    ghb:
        build_dependencies: 
            model: '@module.gwf'          
        func: 'flopy.mf6.ModflowGwfghb'
        duplicates_allowed: True

    rcha:
        build_dependencies: 
            model: '@module.gwf'
        func: 'flopy.mf6.ModflowGwfrcha'
        duplicates_allowed: True
    
    rch:
        build_dependencies: 
            model: '@module.gwf'
        func: 'flopy.mf6.ModflowGwfrch'
        duplicates_allowed: True


    # ??
    sfr:
        build_dependencies: 
            model: '@module.gwf'
        func: 'flopy.mf6.ModflowGwfsfr'
        duplicates_allowed: True

    oc:
        build_dependencies: 
            model: '@module.gwf'
        func: 'flopy.mf6.ModflowGwfoc'
        duplicates_allowed: True